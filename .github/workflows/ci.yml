name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      # pygame 在 CI 环境无显示器/无声卡，必须使用 dummy 驱动
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies for pygame
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-2.0-0 \
            libsdl2-mixer-2.0-0 \
            libsdl2-image-2.0-0 \
            libsdl2-ttf-2.0-0 \
            libfreetype6 \
            libportmidi0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8 lint
        run: python -m flake8 plane-war.py tests/

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Health check (import game module)
        run: |
          python -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('plane_war', 'plane-war.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert hasattr(m, 'Game')
          assert hasattr(m, 'Player')
          print('Game module import OK')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t plane-war:ci .

      - name: Smoke test container
        run: |
          # 容器内跑 lint + 测试，验证 Dockerfile 真正可用
          docker run --rm \
            -e SDL_VIDEODRIVER=dummy \
            -e SDL_AUDIODRIVER=dummy \
            plane-war:ci \
            sh -c "python -m flake8 plane-war.py tests/ && python -m pytest tests/ -v"
